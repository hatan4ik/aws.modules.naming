name: Bug report
description: A name, tag, validation, or output behaves differently from what the module documents.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Redact account IDs, ARNs, and internal repository names before pasting configuration or output.
  - type: input
    id: module-version
    attributes:
      label: Module version or commit
      description: The tag or commit SHA pinned in your module `source` / `ref`.
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: terraform-version
    attributes:
      label: Terraform version
      description: Output of `terraform version`.
      placeholder: 1.7.5
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - input validation (variables.tf)
        - names or tags derivation (locals.tf)
        - outputs or the name_max_length precondition (outputs.tf)
        - examples
        - documentation
        - not sure
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest module call that reproduces the problem.
      render: hcl
      placeholder: |
        module "naming" {
          source = "git::https://github.com/hatan4ik/aws.modules.naming.git?ref=v1.0.0"

          environment     = "dev"
          root            = "sandbox-platform"
          repository      = "hatan4ik/devops-aws-infra"
          name_components = ["sandbox", "platform", "dev"]
        }
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Plan output
      description: Relevant `terraform plan` output, with account IDs and internal names redacted.
      render: shell
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I redacted secrets, account IDs, and internal names from everything above.
          required: true
        - label: I searched existing issues for this problem.
          required: true
