name: Feature request
description: Propose a new input, output, or behaviour for the module.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        The v1 interface is frozen: consumers derive live resource names from `name_prefix`, `names`, and `tags`. A v1 feature must be an optional addition that leaves every existing output unchanged for existing inputs. Anything else is a v2 proposal; see "Deferred to v2" in docs/DESIGN.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do with the module today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: Proposed interface
      description: The variables, outputs, or behaviour you expect, written as HCL.
      render: hcl
      placeholder: |
        variable "example" {
          description = "..."
          type        = string
          default     = null
        }
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Where does it belong?
      options:
        - input validation (variables.tf)
        - names or tags derivation (locals.tf)
        - outputs (outputs.tf)
        - a new example
        - not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, such as deriving the value in your root.
  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints
      options:
        - label: The proposal is strictly additive and optional, and changes no existing output for existing inputs.
        - label: The proposal does not require a provider, a resource, or a data source.
        - label: If it is a breaking change, it is labelled as a v2 proposal above.
